name: ImmoRadar checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scripts and tests
        run: |
          node --check app-core.js
          node --check snapshot-core.js
          node --check dashboard.js
          node --check map-core.js
          node --check map-view.js
          node --check eml-dashboard.js
          node --check public-listings.js
          node --check email-parser.js
          node --check email-alerts.js
          node --check cockpit.js
          node --check research.js
          node --check portal-access.js
          node --check saved-search.js
          node --check scripts/sync-feeds.mjs
          node tests/email-parser.test.mjs
          node tests/app-core.test.mjs
          node tests/map-core.test.mjs
          node tests/snapshot-core.test.mjs
          node tests/market-check.mjs
          node scripts/sync-feeds.mjs --check
